spring:
  application:
    name: sentinel

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sentinel}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        envers:
          audit_table_suffix: _aud
          store_data_at_delete: true
    open-in-view: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8180/realms/sentinel}

server:
  port: ${SERVER_PORT:8080}

sentinel:
  ingestion:
    interval-ms: ${INGESTION_INTERVAL_MS:5000}
  integrity:
    citation-store: ${INTEGRITY_CITATION_STORE:local-audit-log}

logging:
  level:
    com.company.sentinel: INFO
    org.hibernate.envers: WARN
